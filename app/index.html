function resultSummary(w){
  const r = w.result;
  const rows = [];
  if(r.actualDistance) rows.push(['Distance', dispMiStr(+r.actualDistance)]);
  if(r.actualDuration) rows.push(['Duration', minToClock(+r.actualDuration)]);
  if(r.avgPace) rows.push(['Avg pace', r.avgPace+'/mi']);
  if(r.avgHR) rows.push(['Avg HR', r.avgHR+' bpm']);
  if(r.rpe) rows.push(['RPE', r.rpe+'/10']);
  if(r.feel) rows.push(['Felt', ['—','Rough','Below par','OK','Good','Great'][r.feel]]);
  if(r.notes) rows.push(['Notes', r.notes]);
  return '<div class="stack" style="gap:6px;margin-top:6px;">'+rows.map(x=>'<div class="row between"><span class="faint" style="font-size:12.5px;">'+x[0]+'</span><span style="font-size:13px;font-weight:600;">'+x[1]+'</span></div>').join('')+'</div>';
}

    }).join('')+'</div>'+
    '<div class="field" style="margin-top:12px;"><label>Notes</label><textarea id="str-notes" placeholder="Optional">'+((w.result&&w.result.notes)||'')+'</textarea></div>'+
    '<button class="btn btn-primary btn-block" id="str-save" style="margin-top:14px;">'+icon('check')+'Save</button>';
  const sheet = openSheet(html);
  sheet.querySelectorAll('.check-row').forEach(function(row){
    row.onclick = function(){
      const i = +row.getAttribute('data-i'); done[i] = !done[i];
      row.classList.toggle('done', done[i]); row.querySelector('.checkbox').classList.toggle('on', done[i]);
    };
  });
  document.getElementById('str-save').onclick = function(){
    const allDone = done.every(Boolean), someDone = done.some(Boolean);
    WorkoutRepository.update(State.athleteId, w.id, {
      status: allDone?'completed':(someDone?'partial':'skipped'),
      actualDate: todayISO(),
      result: {exercisesDone: done, notes: document.getElementById('str-notes').value||null, loggedAt:new Date().toISOString()}
    });
    closeSheet(); render(); toast(allDone?'Strength banked.':'Saved.');
  };
}

/* ---------- Move workout ---------- */
function openMoveModal(workoutId){
  const w = WorkoutRepository.get(State.athleteId, workoutId);
  if(!w) return;
  const html = '<div class="sheet-head"><div class="sheet-title">Move session</div><button class="sheet-close">'+icon('x')+'</button></div>'+
    '<p class="faint" style="font-size:12.5px;margin-bottom:14px;">'+w.title+' — currently '+humanLong(w.plannedDate)+'</p>'+
    '<div class="field"><label>New date</label><input type="date" id="move-date" value="'+w.plannedDate+'"></div>'+
    '<div id="move-warnings" style="margin-top:12px;"></div>'+
    '<button class="btn btn-primary btn-block" id="move-confirm" style="margin-top:16px;">Confirm move</button>';
  const sheet = openSheet(html);
  const dateInput = document.getElementById('move-date');
  const warnBox = document.getElementById('move-warnings');
  function refreshWarnings(){
    const warnings = checkMoveConflicts(State.athleteId, w.id, dateInput.value);
    warnBox.innerHTML = warnings.map(msg=>'<div class="insight" style="border-color:rgba(231,181,75,0.35);"><span style="color:var(--amber);">'+icon('info')+'</span><p>'+msg+'</p></div>').join('');
  }
  dateInput.oninput = refreshWarnings;
  refreshWarnings();
  document.getElementById('move-confirm').onclick = function(){
    const newDate = dateInput.value;
    WorkoutRepository.update(State.athleteId, w.id, {plannedDate:newDate, moved:true, originalDate: w.originalDate||w.plannedDate});
    closeSheet(); render(); toast('Moved to '+humanShort(newDate)+'.');
  };
}

/* ---------- Freeform log ---------- */
function openFreeformLog(){
  const html = '<div class="sheet-head"><div class="sheet-title">Log a run</div><button class="sheet-close">'+icon('x')+'</button></div>'+
    '<form id="free-form" class="stack">'+
      '<div class="field"><label>Date</label><input type="date" name="date" value="'+todayISO()+'" max="'+todayISO()+'"></div>'+
      '<div class="form-grid">'+
        '<div class="field"><label>Distance ('+unitLabel()+')</label><input type="number" step="0.01" name="dist" placeholder="5"></div>'+
        '<div class="field"><label>Duration (min)</label><input type="number" name="dur" placeholder="30"></div>'+
      '</div>'+
      '<div class="field"><label>RPE (1–10)</label><input type="number" min="1" max="10" name="rpe"></div>'+
      '<div class="field"><label>Notes</label><textarea name="notes" placeholder="What was this run?"></textarea></div>'+
      '<button class="btn btn-primary btn-block" type="submit">'+icon('check')+'Save</button>'+
    '</form>';
  const sheet = openSheet(html);
  document.getElementById('free-form').onsubmit = function(e){
    e.preventDefault();
    const fd = new FormData(e.target);
    const distMi = fd.get('dist') ? (unitLabel()==='km' ? (+fd.get('dist'))/1.60934 : +fd.get('dist')) : null;
    const list = WorkoutRepository.all(State.athleteId);
    const wn = Math.max(1, Math.min(23, Math.floor(daysBetween(SEED_START, fd.get('date'))/7)+1));
    const w = {
      id: uid(), athleteId: State.athleteId, weekN: wn, phaseId: phaseForWeek(wn).id,
      type:'run', subtype:'extra', code:'E', title:'Extra run', optional:true,
      plannedDate: fd.get('date'), actualDate: fd.get('date'), status:'completed', moved:false, originalDate:null,
      plannedDistance:null, plannedDuration:null, targetPace:'—', targetRPE:'—',
      purpose:'Unplanned extra activity, logged manually.', coachNote:'', steps:[],
      result:{ actualDistance:distMi, actualDuration: fd.get('dur')?+fd.get('dur'):null, rpe: fd.get('rpe')?+fd.get('rpe'):null, notes: fd.get('notes')||null, source:'manual', loggedAt:new Date().toISOString() }
    };
    list.push(w); WorkoutRepository.save(State.athleteId, list);
    closeSheet(); render(); toast('Extra run logged.');
  };
}

/* ---------- Benchmark follow-up ---------- */
function offerBenchmarkFollowup(w){
  const a = athlete();
  const html = '<div class="sheet-head"><div class="sheet-title">Record 5K time</div><button class="sheet-close">'+icon('x')+'</button></div>'+
    '<p class="faint" style="font-size:12.5px;margin-bottom:14px;">Baseline 5K was '+a.baseline.fiveK+'. This recalibrates training paces — it never rewrites past workouts.</p>'+
    '<div class="field"><label>5K time (mm:ss)</label><input type="text" id="bench-time" placeholder="27:30"></div>'+
    '<button class="btn btn-primary btn-block" id="bench-save" style="margin-top:14px;">Save benchmark</button>';
  const sheet = openSheet(html);
  document.getElementById('bench-save').onclick = function(){
    const val = document.getElementById('bench-time').value.trim();
    const m = val.match(/^(\d+):(\d\d)$/);
    if(!m){ toast('Enter time as mm:ss'); return; }
    const sec = (+m[1])*60+(+m[2]);
    const baseParts = a.baseline.fiveK.match(/^(\d+):(\d\d)$/);
    const baseSecClean = baseParts ? (+baseParts[1])*60+(+baseParts[2]) : sec;
    const diff = baseSecClean - sec;
    const pct = round1(diff/baseSecClean*100);
    const paceSecPerMi = sec / 3.107;
    closeSheet();
    setTimeout(function(){
      const html2 = '<div class="sheet-head"><div class="sheet-title">Benchmark recorded</div><button class="sheet-close">'+icon('x')+'</button></div>'+
        '<div class="grid-3" style="margin:6px 0 16px;">'+
          '<div class="stat-tile"><div class="st-label">Result</div><div class="st-val">'+val+'</div></div>'+
          '<div class="stat-tile"><div class="st-label">Change</div><div class="st-val">'+(diff>=0?'-':'+')+Math.abs(diff)+'s</div></div>'+
          '<div class="stat-tile"><div class="st-label">Improvement</div><div class="st-val">'+pct+'%</div></div>'+
        '</div>'+
        '<p class="faint" style="font-size:12.5px;">New 5K pace would be roughly '+paceSecToStr(paceSecPerMi)+'/mi. Accepting updates future target paces and keeps the old ones in history — nothing already logged is rewritten.</p>'+
        '<div class="row" style="gap:10px;margin-top:16px;">'+
          '<button class="btn btn-secondary btn-block" id="bench-keep">Keep current paces</button>'+
          '<button class="btn btn-primary btn-block" id="bench-accept">Accept new paces</button>'+
        '</div>';
      const s2 = openSheet(html2);
      function finish(accepted){
        BenchmarkRepository.add(State.athleteId, {
          date: todayISO(), type:'5K', result: val, baselineResult: a.baseline.fiveK,
          improvementSec: diff, improvementPct: pct, derivedPace: paceSecToStr(paceSecPerMi),
          acceptedPaceUpdates: accepted
        });
        closeSheet(); render(); toast(accepted?'Paces recalibrated.':'Benchmark saved — current paces kept.');
      }
      document.getElementById('bench-keep').onclick = ()=>finish(false);
      document.getElementById('bench-accept').onclick = ()=>finish(true);
    }, 260);
  };
}

/* ---------- Race day card + checklist ---------- */
function renderRaceDayCard(a){
  let html = '<div class="today-session-card" style="background:linear-gradient(160deg, var(--coral-dim), var(--panel));border-color:rgba(255,107,107,0.3);">'+
    '<div class="eyebrow" style="color:var(--coral);">Race day</div>'+
    '<div class="today-big-title">Lisbon Half Marathon</div>'+
    '<div class="today-target">'+
      '<div>Goal<b>Sub '+a.goalTime.slice(0,4)+'</b></div>'+
      '<div>Goal pace<b>'+a.goalPace+'</b></div>'+
    '</div>'+
  '</div>';
  html += '<div class="card"><div class="section-title">Pacing plan</div>'+
    '<div class="stack" style="gap:8px;margin-top:8px;">'+
      '<div class="row" style="gap:9px;"><span style="width:5px;height:5px;border-radius:50%;background:var(--coral);"></span><span style="font-size:13.5px;">Miles 1–3: controlled, ~9:10–9:15/mi</span></div>'+
      '<div class="row" style="gap:9px;"><span style="width:5px;height:5px;border-radius:50%;background:var(--coral);"></span><span style="font-size:13.5px;">Miles 4–10: settle around goal pace</span></div>'+
      '<div class="row" style="gap:9px;"><span style="width:5px;height:5px;border-radius:50%;background:var(--coral);"></span><span style="font-size:13.5px;">Miles 11–13.1: race by feel if still in control</span></div>'+
    '</div></div>';
  html += '<div class="card"><div class="section-title">Manual splits</div><div class="field" style="margin-top:8px;"><label>Estimated finish from current average pace</label>'+
    '<input type="text" id="race-avgpace-'+a.id+'" placeholder="Enter average pace so far, e.g. 9:12"></div>'+
    '<div id="race-estimate-'+a.id+'" class="faint" style="font-size:13px;margin-top:8px;"></div></div>';
  html += raceChecklistCard(a.id);
  return html;
}
const RACE_CHECKLIST_ITEMS = ['Shoes','Socks','Watch charged','Breakfast plan','Gels / fuelling','Race number','Travel plan','Start time confirmed','Warm-up plan','Weather checked'];
function raceChecklistCard(aid){
  const checked = lsGet('lisbon.checklist.'+aid, []);
  return '<div class="card"><div class="section-title">Race checklist</div><div class="stack" style="margin-top:6px;" id="race-checklist-'+aid+'">'+
    RACE_CHECKLIST_ITEMS.map(function(item,i){
      const on = checked.indexOf(i)>-1;
      return '<div class="check-row '+(on?'done':'')+'" data-ci="'+i+'"><div class="checkbox '+(on?'on':'')+'">'+icon('check')+'</div><span>'+item+'</span></div>';
    }).join('')+'</div></div>';
}
function bindRaceDayExtras(view, athletes){
  (athletes||[]).forEach(function(a){
    const aid = a.id;
    const pace = document.getElementById('race-avgpace-'+aid);
    if(pace) pace.oninput = function(){
      const sec = paceStrToSec(pace.value);
      const est = document.getElementById('race-estimate-'+aid);
      if(sec){ const totalSec = sec*13.1; const h=Math.floor(totalSec/3600), m=Math.floor((totalSec%3600)/60); est.textContent = 'Estimated finish: '+h+':'+pad2(m)+' at this pace.'; }
      else if(est) est.textContent='';
    };
    const cl = document.getElementById('race-checklist-'+aid);
    if(cl) cl.querySelectorAll('.check-row').forEach(function(row){
      row.onclick = function(){
        const i = +row.getAttribute('data-ci');
        let checked = lsGet('lisbon.checklist.'+aid, []);
        const on = checked.indexOf(i)>-1;
        checked = on ? checked.filter(x=>x!==i) : checked.concat([i]);
        lsSet('lisbon.checklist.'+aid, checked);
        row.classList.toggle('done', !on); row.querySelector('.checkbox').classList.toggle('on', !on);
      };
    });
  });
}

/* =========================================================
   EXPORT / IMPORT / PRINT
   ========================================================= */
function exportBackup(){
  const payload = { version:1, exportedAt:new Date().toISOString(), athletes: AthleteRepository.all(), data:{} };
  AthleteRepository.all().forEach(function(a){
    payload.data[a.id] = { workouts: WorkoutRepository.all(a.id), benchmarks: BenchmarkRepository.all(a.id), reviews: ReviewRepository.all(a.id) };
  });
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = 'lisbon-training-backup-'+todayISO()+'.json';
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  URL.revokeObjectURL(url);
  toast('Backup downloaded.');
}
function triggerImport(){
  let input = document.getElementById('import-file-input');
  if(!input){
    input = document.createElement('input'); input.type='file'; input.accept='application/json'; input.id='import-file-input'; input.style.display='none';
    document.body.appendChild(input);
    input.onchange = function(e){
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = function(){
        try{
          const payload = JSON.parse(reader.result);
          if(!payload.athletes || !payload.data) throw new Error('bad format');
          AthleteRepository.save(payload.athletes);
          Object.keys(payload.data).forEach(function(aid){
            WorkoutRepository.save(aid, payload.data[aid].workouts||[]);
            BenchmarkRepository.save(aid, payload.data[aid].benchmarks||[]);
            ReviewRepository.save(aid, payload.data[aid].reviews||[]);
          });
          toast('Backup restored.');
          render();
        }catch(err){ toast('Could not read that file.'); }
      };
      reader.readAsText(file);
      input.value='';
    };
  }
  input.click();
}
function printRaceWeek(){
  const a = athlete();
  const w = document.open('', '_blank');
  const list = WorkoutRepository.forWeek(a.id, 23).sort((x,y)=>x.plannedDate.localeCompare(y.plannedDate));
  let body = '<h1 style="font-family:sans-serif;">Lisbon Half Marathon — Race Week</h1>'+
    '<p style="font-family:sans-serif;color:#444;">'+a.name+' · Goal '+a.goalTime+' · '+a.goalPace+'</p><hr>'+
    list.map(x=>'<div style="font-family:sans-serif;padding:10px 0;border-bottom:1px solid #ddd;"><b>'+humanLong(x.plannedDate)+'</b> — '+x.title+(x.plannedDistance?(' · '+x.plannedDistance+' mi'):'')+(x.plannedDuration?(' · '+x.plannedDuration+' min'):'')+'</div>').join('')+
    '<h2 style="font-family:sans-serif;margin-top:24px;">Race checklist</h2><ul style="font-family:sans-serif;">'+RACE_CHECKLIST_ITEMS.map(i=>'<li>'+i+'</li>').join('')+'</ul>';
  w.document.write('<html><head><title>Race week — Lisbon</title></head><body style="max-width:640px;margin:40px auto;">'+body+'</body></html>');
  w.document.close();
  setTimeout(()=>w.print(), 300);
}
